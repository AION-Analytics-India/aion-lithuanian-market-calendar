[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aion-lithuanian-market-calendar"
version = "1.0.2"
description = "Lithuanian and European market calendar: timezone-correct trading sessions for 19 EU venues, computed Lithuanian holidays, and exchange holiday data that updates itself without a release."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AION Analytics", email = "contact@aionanalytics.in" }]
keywords = [
  "lithuania", "lithuanian", "holidays", "public holidays", "bank holidays",
  "market calendar", "business days", "working days", "nasdaq vilnius", "XVIL",
  "svenciu dienos", "darbo dienos", "baltic", "europe",
  "trading hours", "market hours", "trading sessions", "exchange calendar",
  "euronext", "xetra", "nasdaq baltic", "nasdaq nordic", "MIC", "ISO 10383",
  "timezone", "zoneinfo", "DST", "MiFID II", "european exchanges",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: English",
  "Natural Language :: Lithuanian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies. zoneinfo is stdlib from 3.9; Windows has no system
# tz database, so tzdata is pulled there and nowhere else.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.urls]
"Homepage" = "https://aionanalytics.in/open-source/lithuanian-market-calendar"
"Documentation" = "https://github.com/AION-Analytics-India/aion-lithuanian-market-calendar#readme"
"Source" = "https://github.com/AION-Analytics-India/aion-lithuanian-market-calendar"
"Issues" = "https://github.com/AION-Analytics-India/aion-lithuanian-market-calendar/issues"
"Changelog" = "https://github.com/AION-Analytics-India/aion-lithuanian-market-calendar/blob/main/CHANGELOG.md"


[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

# The bundled holiday data and its manifest travel in the wheel. Without them
# an installed package falls back to rule-only mode, which works but knows
# nothing about exchange closures.
[tool.setuptools.package-data]
"aion_lithuanian_market_calendar" = ["data/*.json"]
