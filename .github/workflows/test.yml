name: tests

on:
  push: { branches: [main] }
  pull_request:
  # The data is only as good as its last review. A monthly run catches a
  # manifest that stopped matching its files without anybody touching the code.
  schedule: [{ cron: "0 6 1 * *" }]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is here on purpose: it has no system tz database, so a missing
        # tzdata dependency breaks every session check and passes everywhere else.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
        env:
          AION_LT_CALENDAR_OFFLINE: "1"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Manifests match their files, and the data is self-consistent
        run: python -m ingest verify
      - name: No hardcoded UTC offset anywhere
        # An offset written down in source is wrong twice a year. zoneinfo or
        # nothing.
        run: |
          if grep -rnE '\+0[23]:00|timedelta\(hours=[23]\)' src/; then
            echo "hardcoded UTC offset found; use zoneinfo"; exit 1
          fi
          echo "clean"
