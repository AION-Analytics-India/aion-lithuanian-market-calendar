name: tests

on:
  push: { branches: [main] }
  pull_request:
  # The data is only as good as its last review. A monthly run catches a
  # manifest that stopped matching its files without anybody touching the code.
  schedule: [{ cron: "0 6 1 * *" }]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is here on purpose: it has no system tz database, so a missing
        # tzdata dependency breaks every session check and passes everywhere else.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
        env:
          AION_LT_CALENDAR_OFFLINE: "1"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # The ingest tool moved to aion-market-calendar-data in 1.0.0, which is
      # where the published data is verified. What this repository owns is the
      # bundled fallback copy, so this step verifies that, with the same check
      # the package runs before adopting any data.
      - run: pip install -e .
      - name: The bundled manifest matches the bundled files
        run: |
          python - <<'PY'
          import sys
          from aion_lithuanian_market_calendar import store
          ok, reason = store._verify(store.BUNDLED_DIR)
          print(f"bundled data: {reason}")
          sys.exit(0 if ok else 1)
          PY
      - name: No hardcoded UTC offset anywhere
        # An offset written down in source is wrong twice a year. zoneinfo or
        # nothing.
        run: |
          if grep -rnE '\+0[23]:00|timedelta\(hours=[23]\)' src/; then
            echo "hardcoded UTC offset found; use zoneinfo"; exit 1
          fi
          echo "clean"
